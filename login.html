{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
    <h2>Log in</h2>
    <form method="POST">
        <div class="stack">
            <label>Username
                <input type="text" name="username" required autofocus>
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
        </div>
        <button type="submit">Log in</button>
    </form>
</section>
{% endblock %}
